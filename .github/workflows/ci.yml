name: PHP CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
defaults:
  run:
    shell: bash
jobs:
  build:

    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest]
        php-versions: ['5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2']
        # Run the existing suite on both supported dependency lines.
        # psr7 2.x requires PHP >= 7.2.5, so older jobs only run the 1.x line.
        deps: ['rfc6455-0.3.0-psr7-1', 'rfc6455-0.3.1-psr7-2']
        exclude:
          - php-versions: '5.6'
            deps: 'rfc6455-0.3.1-psr7-2'
          - php-versions: '7.0'
            deps: 'rfc6455-0.3.1-psr7-2'
          - php-versions: '7.1'
            deps: 'rfc6455-0.3.1-psr7-2'
    name: PHP ${{ matrix.php-versions }} ${{ matrix.deps }} on ${{ matrix.operating-system }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: mbstring, intl
        ini-values: post_max_size=256M, max_execution_time=180
        coverage: xdebug
        tools: php-cs-fixer, phpunit:11.2.0

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Install dependencies
      env:
        DEPS: ${{ matrix.deps }}
      run: |
        set -euo pipefail
        # Composer 2.2 (PHP 5.6–7.1) only accepts --with for root requirements.
        # psr7 is transitive, so pin it by adding a root requirement in this checkout.
        if [ "$DEPS" = "rfc6455-0.3.0-psr7-1" ]; then
          composer require --no-update --no-interaction \
            "ratchet/rfc6455:0.3.0" \
            "guzzlehttp/psr7:^1.7"
        else
          composer require --no-update --no-interaction \
            "ratchet/rfc6455:0.3.1" \
            "guzzlehttp/psr7:^2.0"
        fi
        composer update --prefer-dist --no-progress --with-all-dependencies

    - name: Assert dependency set
      env:
        DEPS: ${{ matrix.deps }}
      run: |
        php -r '
          $lock = json_decode(file_get_contents("composer.lock"), true);
          $installed = array();
          foreach (array_merge($lock["packages"], $lock["packages-dev"]) as $package) {
            $installed[$package["name"]] = ltrim($package["version"], "v");
          }
          $rfc = $installed["ratchet/rfc6455"];
          $psr = $installed["guzzlehttp/psr7"];
          $rfcParts = explode(".", $rfc);
          $rfcNorm = $rfcParts[0].".".(isset($rfcParts[1]) ? $rfcParts[1] : "0").".".(isset($rfcParts[2]) ? $rfcParts[2] : "0");
          fwrite(STDOUT, "ratchet/rfc6455 ".$rfc."\nguzzlehttp/psr7 ".$psr."\n");
          if (getenv("DEPS") === "rfc6455-0.3.0-psr7-1") {
            // Composer records the 0.3.0 tag as 0.3.
            if ($rfcNorm !== "0.3.0" || strpos($psr, "1.") !== 0) {
              fwrite(STDERR, "expected rfc6455 0.3.0 and psr7 1.x\n");
              exit(1);
            }
          } elseif ($rfcNorm !== "0.3.1" || strpos($psr, "2.") !== 0) {
            fwrite(STDERR, "expected rfc6455 0.3.1 and psr7 2.x\n");
            exit(1);
          }
        '

    - name: Run unit test case
      run: composer unit

    - name: Upload Coverage Report
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # required

    - name: Run feature test case
      run: composer feature
